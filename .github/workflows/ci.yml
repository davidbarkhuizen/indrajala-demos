name: CI

on:
  push:
    branches: [main]
  pull_request:

# As indrajala-ml's CI, against the indrajala-ml submodule's commit (D6 of indrajala-ml's
# docs/demos-split-workplan.md): a library change that breaks a demo shows on the bump PR.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.14"

      - name: Crate wheel key
        id: rust-commit
        run: |
          echo "sha=$(git -C indrajala-ml/rust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(sed -n 's/^maturin_version="\(.*\)"$/\1/p' indrajala-ml/cli)" >> "$GITHUB_OUTPUT"

      - name: Cache crate wheel
        id: rust-wheel
        uses: actions/cache@v6
        with:
          path: .rust-wheel
          key: rust-wheel-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-maturin${{ steps.rust-commit.outputs.maturin }}-${{ steps.rust-commit.outputs.sha }}

      - name: Install pinned Rust toolchain
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        working-directory: indrajala-ml/rust
        run: rustup toolchain install

      - name: Cache crate dependency builds
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: indrajala-ml/rust -> target

      - name: Setup
        run: ./cli setup --no-os-packages --rust-wheel-dir .rust-wheel --no-data

      - name: Lint
        run: ./cli lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.14"

      - name: Cache datasets
        uses: actions/cache@v6
        with:
          path: |
            indrajala-ml/data/mnist
            indrajala-ml/data/tinyshakespeare
            indrajala-ml/data/herodotus-rawlinson
            indrajala-ml/data/muqaddimah
            indrajala-ml/data/euclid-heath
          key: datasets-${{ hashFiles('indrajala-ml/scripts/fetch_datasets.py') }}

      - name: Crate wheel key
        id: rust-commit
        run: |
          echo "sha=$(git -C indrajala-ml/rust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(sed -n 's/^maturin_version="\(.*\)"$/\1/p' indrajala-ml/cli)" >> "$GITHUB_OUTPUT"

      - name: Cache crate wheel
        id: rust-wheel
        uses: actions/cache@v6
        with:
          path: .rust-wheel
          key: rust-wheel-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-maturin${{ steps.rust-commit.outputs.maturin }}-${{ steps.rust-commit.outputs.sha }}

      - name: Install pinned Rust toolchain
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        working-directory: indrajala-ml/rust
        run: rustup toolchain install

      - name: Cache crate dependency builds
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: indrajala-ml/rust -> target

      - name: Setup
        run: ./cli setup --no-os-packages --rust-wheel-dir .rust-wheel

      - name: Test
        run: ./cli test
